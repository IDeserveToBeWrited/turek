<!-- Generated by Gemini -->
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Edytor Quick Reply (SII)</title>
    <style>
        :root {
            --primary: #0078D7;
            --bg: #f3f3f3;
            --surface: #ffffff;
            --border: #cccccc;
            --text: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        h2 {
            text-align: center;
            color: var(--primary);
        }
        #dropzone {
            border: 3px dashed var(--primary);
            background-color: var(--surface);
            padding: 60px 20px;
            text-align: center;
            border-radius: 12px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            margin: 20px auto;
            max-width: 600px;
        }
        #dropzone:hover, #dropzone.dragover {
            background-color: #e6f2ff;
        }
        #editor {
            display: none;
            max-width: 800px;
            margin: 0 auto;
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .group {
            border-left: 4px solid var(--primary);
            background: #fafafa;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 0 8px 8px 0;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.02);
        }
        .group-title {
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1em;
            color: var(--primary);
        }
        .item {
            margin-left: 20px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        .item label {
            width: 40px;
            color: #666;
            font-size: 1.5em;
            line-height: 1;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0, 120, 215, 0.2);
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #005a9e;
        }
    </style>
</head>
<body>

    <h2>Edytor Odpowiedzi (Quick Reply)</h2>

    <div id="dropzone">
        Przeciągnij i upuść plik <b>.sii</b> tutaj<br><br>
        <span style="font-size: 0.9em; color: #666;">lub kliknij, aby wybrać z dysku</span>
    </div>
    <input type="file" id="fileInput" style="display:none" accept=".sii,.txt">
    
    <div id="editor">
        <div id="tree"></div>
        <button id="saveBtn">Zapisz i pobierz plik</button>
    </div>

    <script>
        let originalFileContent = "";
        let parsedBlocks = {};
        let rootNodeId = "";

        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const editor = document.getElementById('editor');
        const tree = document.getElementById('tree');
        const saveBtn = document.getElementById('saveBtn');

        // Obsługa Drag & Drop - Poprawiony błąd składniowy
        dropzone.addEventListener('click', () => fileInput.click());
        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
        dropzone.addEventListener('dragleave', () => { dropzone.classList.remove('dragover'); });
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault(); 
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) loadFile(e.target.files[0]);
        });

        // Wczytywanie pliku
        function loadFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                originalFileContent = e.target.result;
                parseSii(originalFileContent);
                buildUI();
                editor.style.display = 'block';
                dropzone.style.display = 'none';
            };
            reader.readAsText(file);
        }

        // Parsowanie struktury z pliku tekstowego
        function parseSii(text) {
            parsedBlocks = {};
            
            // Szukanie węzła 'root'
            const rootMatch = text.match(/root:\s*([^\s\n}]+)/);
            if (rootMatch) rootNodeId = rootMatch[1];

            // Wyciąganie każdego bloku quick_reply
            const blockRegex = /quick_reply\s*:\s*([^\s{]+)\s*\{([\s\S]*?)\}/g;
            let match;
            
            while ((match = blockRegex.exec(text)) !== null) {
                const id = match[1];
                const content = match[2];
                
                // Szukanie reply_text
                const textMatch = content.match(/reply_text:\s*("([^"]*)"|([^\s\n]+))/);
                let replyText = "";
                if (textMatch) {
                    replyText = textMatch[2] !== undefined ? textMatch[2] : textMatch[3];
                }
                
                const isGroup = content.includes("is_group: true");
                
                // Szukanie wszystkich sub_replies
                const subReplies = [];
                const subRegex = /sub_replies\[\d+\]:\s*([^\s\n]+)/g;
                let subMatch;
                while ((subMatch = subRegex.exec(content)) !== null) {
                    subReplies.push(subMatch[1]);
                }
                
                parsedBlocks[id] = { 
                    id: id, 
                    reply_text: replyText, 
                    is_group: isGroup, 
                    sub_replies: subReplies 
                };
            }
        }

        // Budowanie interfejsu
        function buildUI() {
            tree.innerHTML = "";
            if (!rootNodeId || !parsedBlocks[rootNodeId]) {
                tree.innerHTML = "<p style='color:red;'>Błąd: Nie znaleziono głównego węzła w pliku. Upewnij się, że to poprawny plik konfiguracyjny.</p>";
                return;
            }
            
            const rootBlock = parsedBlocks[rootNodeId];
            rootBlock.sub_replies.forEach(subId => {
                tree.appendChild(createNodeUI(subId));
            });
        }

        function createNodeUI(id) {
            const block = parsedBlocks[id];
            if (!block) return document.createElement('div');

            if (block.is_group) {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'group';
                
                const titleDiv = document.createElement('div');
                titleDiv.className = 'group-title';
                titleDiv.innerText = "Kategoria: ";
                
                const input = document.createElement('input');
                input.type = 'text';
                input.value = block.reply_text;
                input.addEventListener('input', (e) => block.reply_text = e.target.value);
                
                titleDiv.appendChild(input);
                groupDiv.appendChild(titleDiv);
                
                block.sub_replies.forEach(subId => {
                    groupDiv.appendChild(createNodeUI(subId));
                });
                return groupDiv;
            } else {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item';
                
                const label = document.createElement('label');
                label.innerHTML = "&#8627;"; 
                
                const input = document.createElement('input');
                input.type = 'text';
                input.value = block.reply_text;
                input.addEventListener('input', (e) => block.reply_text = e.target.value);
                
                itemDiv.appendChild(label);
                itemDiv.appendChild(input);
                return itemDiv;
            }
        }

        // Zapisywanie pliku
        saveBtn.addEventListener('click', () => {
            let output = originalFileContent;
            
            for (const [id, block] of Object.entries(parsedBlocks)) {
                const escapeId = id.replace(/\./g, '\\.');
                const regex = new RegExp(`(quick_reply\\s*:\\s*${escapeId}\\s*\\{[\\s\\S]*?reply_text:\\s*)("?[^"\\n]*"?)`);
                
                let newValue = `"${block.reply_text}"`;
                if (block.reply_text === "root") newValue = "root";

                output = output.replace(regex, `$1${newValue}`);
            }

            const blob = new Blob([output], { type: "text/plain;charset=utf-8" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "quick_replies_modified.sii";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
